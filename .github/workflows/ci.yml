name: signalops-ci

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.13.0
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: npm ci
      - run: python -m pip install -e '.[dev]'
      - run: npm run lint
      - run: npm audit --omit=dev
      - run: npm test
      - run: npm run backtest
      - run: git diff --exit-code artifacts/backtest-results.json app/data/backtest-results.json
      - run: npm run build
