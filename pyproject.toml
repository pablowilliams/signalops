[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "signalops-analytics"
version = "0.1.0"
description = "Reproducible data incident detection, diagnostics, and evaluation"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "numpy>=2,<3",
  "pandas>=2.2,<3",
  "pydantic>=2.10,<3",
  "scipy>=1.14,<2",
  "uvicorn>=0.34,<1",
]

[project.optional-dependencies]
dev = ["httpx>=0.28,<1", "pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["services/analytics"]

[tool.pytest.ini_options]
pythonpath = ["services/analytics"]
testpaths = ["services/analytics/tests"]
addopts = "-q"
